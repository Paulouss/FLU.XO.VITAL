<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Fluxo Vital — Escolha sua Categoria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    :root {
      --primary-red: #9d040e;
      --dark-red: #7B1B1B;
      --light-pink: #FFF5F7;
      --text-dark: #1A1A1A;
      --text-gray: #6B7280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #FFFFFF 0%, var(--light-pink) 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar-premium {
      background: linear-gradient(135deg, #9d040e 0%, #7B1B1B 100%);
      padding: 1rem 0;
      box-shadow: 0 10px 40px rgba(157, 4, 14, 0.4);
      position: sticky; top: 0; z-index: 1000;
    }
    .navbar-premium .navbar-brand {
      color: white !important;
      font-weight: 900; font-size: 1.6rem;
      display: flex; align-items: center; gap: 12px;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
    .logo-main { font-size: 1.4rem; font-weight: 800; color: #fff; }
    .logo-sub  { font-size: 0.7rem; color: #ffccd0; letter-spacing: 0.08em; }
    .navbar-premium .nav-link { color: rgba(255,255,255,0.95) !important; font-weight: 600; }
    .category-wrapper {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 5rem 2rem;
    }
    .badge-label {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
      color: white; padding: 0.65rem 1.6rem; border-radius: 50px;
      font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 1.5rem;
      box-shadow: 0 8px 25px rgba(157,4,14,0.3);
    }
    .category-title {
      font-size: 3rem; font-weight: 900; color: var(--text-dark);
      margin-bottom: 1rem; line-height: 1.1; letter-spacing: -1px; text-align: center;
    }
    .category-title .gradient-text {
      background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .category-desc {
      font-size: 1.1rem; color: var(--text-gray); max-width: 580px;
      margin: 0 auto 4rem; line-height: 1.8; text-align: center;
    }
    .category-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 2rem; width: 100%; max-width: 1200px;
      margin: 0 auto; justify-content: center;
    }
    .category-card {
      background: white; border-radius: 25px; padding: 2.5rem 2rem;
      text-align: center; border: 3px solid transparent;
      position: relative; overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 15px 50px rgba(0,0,0,0.07);
      cursor: pointer; width: 100%; font-family: 'Inter', sans-serif; outline: none;
    }
    .category-card:hover { transform: translateY(-12px); box-shadow: 0 30px 70px rgba(0,0,0,0.13); }
    .card-banco:hover  { border-color: #c0392b; }
    .card-hosp:hover   { border-color: #2980b9; }
    .card-ong:hover    { border-color: #27ae60; }
    .card-outros:hover { border-color: #8e44ad; }
    .cat-icon {
      width: 90px; height: 90px; margin: 0 auto 1.5rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.4s ease;
    }
    .card-banco  .cat-icon { background: rgba(192,57,43,0.1); }
    .card-hosp   .cat-icon { background: rgba(41,128,185,0.1); }
    .card-ong    .cat-icon { background: rgba(39,174,96,0.1); }
    .card-outros .cat-icon { background: rgba(142,68,173,0.1); }
    .category-card:hover .cat-icon { transform: scale(1.1); }
    .cat-icon i { font-size: 2.5rem; }
    .card-banco  .cat-icon i { color: #c0392b; }
    .card-hosp   .cat-icon i { color: #2980b9; }
    .card-ong    .cat-icon i { color: #27ae60; }
    .card-outros .cat-icon i { color: #8e44ad; }
    .cat-title  { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); margin-bottom: 0.6rem; }
    .cat-desc   { color: var(--text-gray); line-height: 1.65; font-size: 0.9rem; margin-bottom: 1.8rem; }
    .btn-cat {
      display: inline-block; padding: 0.7rem 1.8rem; border: none;
      border-radius: 50px; font-weight: 700; font-size: 0.88rem; color: white;
      pointer-events: none;
    }
    .card-banco  .btn-cat { background: linear-gradient(135deg, #c0392b, #922b21); }
    .card-hosp   .btn-cat { background: linear-gradient(135deg, #2980b9, #1a5276); }
    .card-ong    .btn-cat { background: linear-gradient(135deg, #27ae60, #1e8449); }
    .card-outros .btn-cat { background: linear-gradient(135deg, #8e44ad, #6c3483); }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 3rem;
      color: var(--text-gray); font-size: 0.9rem; font-weight: 600;
      text-decoration: none; transition: all 0.2s ease;
    }
    .btn-back:hover { color: var(--primary-red); transform: translateX(-4px); }
    footer {
      background: #9d040e; color: white;
      text-align: center; padding: 1rem; font-size: 0.92rem;
    }
    @media (max-width: 992px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); max-width: 620px; }
    }
    @media (max-width: 700px) {
      .category-grid { grid-template-columns: 1fr; max-width: 380px; }
      .category-title { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-premium">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="/">
        <div class="logo-text">
          <span class="logo-main">Fluxo Vital</span>
          <span class="logo-sub">Salvando Vidas</span>
        </div>
      </a>
      <div>
        <a class="nav-link text-white" href="/">Início</a>
      </div>
    </div>
  </nav>

  <div class="category-wrapper">
    <div class="badge-label">
      <i class="fa-solid fa-hospital"></i>
      <span>Cadastro de Instituição</span>
    </div>

    <h1 class="category-title">
      Qual é o tipo da <span class="gradient-text">sua instituição?</span>
    </h1>
    <p class="category-desc">
      Selecione a categoria que melhor representa sua instituição para prosseguir com o cadastro na plataforma Fluxo Vital.
    </p>

    <div class="category-grid">

      <button type="button" onclick="selecionarCategoria('BANCOS_DE_DOACAO')" class="category-card card-banco">
        <div class="cat-icon"><i class="fa-solid fa-droplet"></i></div>
        <h3 class="cat-title">Bancos de Doação</h3>
        <p class="cat-desc">Hemocentros, bancos de sangue, medula ou leite materno vinculados à rede de saúde.</p>
        <span class="btn-cat">Selecionar</span>
      </button>

      <button type="button" onclick="selecionarCategoria('HOSPITAIS')" class="category-card card-hosp">
        <div class="cat-icon"><i class="fa-solid fa-hospital"></i></div>
        <h3 class="cat-title">Hospitais</h3>
        <p class="cat-desc">Hospitais públicos ou privados que realizam transfusões e transplantes.</p>
        <span class="btn-cat">Selecionar</span>
      </button>

      <button type="button" onclick="selecionarCategoria('ONGS')" class="category-card card-ong">
        <div class="cat-icon"><i class="fa-solid fa-people-group"></i></div>
        <h3 class="cat-title">ONGs Parceiras</h3>
        <p class="cat-desc">Organizações sem fins lucrativos que apoiam campanhas de doação.</p>
        <span class="btn-cat">Selecionar</span>
      </button>

      <button type="button" onclick="selecionarCategoria('OUTROS')" class="category-card card-outros">
        <div class="cat-icon"><i class="fa-solid fa-building-columns"></i></div>
        <h3 class="cat-title">Outros</h3>
        <p class="cat-desc">UBS, clínicas, laboratórios ou qualquer outra instituição de saúde.</p>
        <span class="btn-cat">Selecionar</span>
      </button>

    </div>

    <script>
      function selecionarCategoria(categoria) {
        window.location.href = '/instituicao/login?categoria=' + encodeURIComponent(categoria);
      }
    </script>

    <a href="/" class="btn-back">
      <i class="bi bi-arrow-left"></i> Voltar à página inicial
    </a>
  </div>

  <footer>
    &copy; <span th:text="${#dates.year(#dates.createNow())}">2025</span> Fluxo Vital — Todos os direitos reservados.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
