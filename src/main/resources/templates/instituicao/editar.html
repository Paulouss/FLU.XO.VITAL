<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Editar Instituição - Fluxo Vital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #ffe9ec; }
    .container {
      margin-top: 40px; max-width: 600px; background: #fff;
      padding: 30px; border-radius: 15px; box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    .btn-custom {
      background-color: #9d040e; color: #fff;
      border-radius: 0.75rem; padding: 0.6rem 1.2rem;
    }
    .btn-custom:hover { background-color: #6a0207; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="mb-4">Editar Dados da Instituição</h2>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger"  th:if="${erro}"   th:text="${erro}"></div>

    <form action="/instituicao/editar" method="post" th:object="${instituicao}">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome da Instituição *</label>
        <input type="text" class="form-control" id="nome" name="nome" required
               th:value="${instituicao?.nome}"/>
      </div>

      <div class="mb-3">
        <label for="cnpj" class="form-label">CNPJ *</label>
        <input type="text" class="form-control" id="cnpj" name="cnpj" required
               th:value="${instituicao?.cnpj}"/>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail *</label>
        <input type="email" class="form-control" id="email" name="email" required
               th:value="${instituicao?.email}"/>
      </div>

      <div class="mb-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="text" class="form-control" id="telefone" name="telefone"
               th:value="${instituicao?.telefone}"/>
      </div>

      <div class="mb-3">
        <label for="endereco" class="form-label">Endereço</label>
        <input type="text" class="form-control" id="endereco" name="endereco"
               th:value="${instituicao?.endereco}"/>
      </div>

      <div class="mb-3">
        <label for="cep" class="form-label">CEP</label>
        <input type="text" class="form-control" id="cep" name="cep"
               th:value="${instituicao?.cep}"/>
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Nova senha (deixe em branco para não alterar)</label>
        <input type="password" class="form-control" id="senha" name="senha"/>
      </div>

      <button type="submit" class="btn btn-custom">Salvar Alterações</button>
      <a href="/instituicao/gerenciar" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
