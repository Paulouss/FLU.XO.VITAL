<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="'Cadastro — ' + ${categoriaLabel} + ' | Fluxo Vital'">Cadastro da Instituição - Fluxo Vital</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-red: #9d040e;
      --dark-red: #7B1B1B;
      --cat-color: #9d040e;
      --cat-color-dark: #7B1B1B;
    }

    body.cat-bancos    { --cat-color: #c0392b; --cat-color-dark: #922b21; }
    body.cat-hospitais { --cat-color: #2980b9; --cat-color-dark: #1a5276; }
    body.cat-ongs      { --cat-color: #27ae60; --cat-color-dark: #1e8449; }
    body.cat-outros    { --cat-color: #8e44ad; --cat-color-dark: #6c3483; }

    body {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF5F7 100%);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ── Navbar premium ── */
    .navbar-premium {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
      padding: 1rem 0;
      box-shadow: 0 10px 40px rgba(157, 4, 14, 0.4);
      position: sticky; top: 0; z-index: 1000;
      border-bottom: 4px solid var(--primary-red);
    }
    .navbar-premium .navbar-brand {
      color: white !important; font-weight: 900; font-size: 1.4rem;
      display: flex; align-items: center; gap: 12px; text-decoration: none;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
    .logo-main { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .logo-sub  { font-size: 0.68rem; color: #ffccd0; letter-spacing: 0.08em; }
    .nav-link-inicio {
      color: rgba(255,255,255,0.95) !important;
      font-weight: 600; font-size: 0.95rem;
      text-decoration: none; padding: 0.6rem 1.1rem;
      border-radius: 50px; transition: all 0.25s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-link-inicio:hover { background: rgba(255,255,255,0.16); color: white !important; }

    /* ── Conteúdo ── */
    .form-container { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 3rem 1rem; }

    .form-card {
      background: #fff; padding: 2.8rem 2.6rem; border-radius: 1.75rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.09);
      border-top: 6px solid var(--cat-color);
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .cat-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.04); color: var(--cat-color);
      padding: 0.4rem 1rem; border-radius: 50px;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; margin-bottom: 1rem;
    }

    .form-card h3 { color: var(--cat-color); font-weight: 800; margin-bottom: 0.35rem; }
    .form-card .subtitle { color: #6c757d; font-size: 0.94rem; margin-bottom: 1.8rem; }

    .section-label {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--cat-color); margin: 1.6rem 0 0.8rem; display: flex; align-items: center; gap: 8px;
    }
    .section-label:first-of-type { margin-top: 0; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: #eee; }

    .input-group { margin-bottom: 1.1rem; }
    .input-group-text {
      background: rgba(0,0,0,0.03); border: 2px solid #e5e7eb; border-right: none;
      color: var(--cat-color); border-radius: 0.9rem 0 0 0.9rem;
    }
    .form-control {
      border-radius: 0 0.9rem 0.9rem 0; border: 2px solid #e5e7eb; border-left: none;
      padding: 0.7rem 1rem; transition: all 0.3s ease;
    }
    .form-control:focus {
      border-color: var(--cat-color); box-shadow: 0 0 0 0.2rem rgba(157, 4, 14, 0.12);
      border-left: none;
    }
    .input-group:focus-within .input-group-text { border-color: var(--cat-color); }

    .btn-fluxo {
      background: linear-gradient(135deg, var(--cat-color) 0%, var(--cat-color-dark) 100%);
      border: none; color: white; padding: 0.9rem; font-weight: 700; font-size: 1.05rem;
      border-radius: 1rem; transition: all 0.3s ease; margin-top: 1.4rem; width: 100%;
    }
    .btn-fluxo:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.25); }

    .alert-danger { background: #fdeceb; color: #a12622; border-radius: 1rem; border: none;
                     padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }

    .login-link { color: #6c757d; text-decoration: none; display: block; text-align: center; margin-top: 1.4rem; font-size: 0.9rem; }
    .login-link:hover { color: var(--cat-color); }
    .login-link strong { color: var(--cat-color); }

    footer {
      background: linear-gradient(135deg, var(--dark-red) 0%, #5c1313 100%);
      color: white; text-align: center; padding: 1.3rem; font-size: 0.88rem;
    }

    @media (max-width: 576px) {
      .form-card { padding: 2rem 1.4rem; }
    }
  </style>

  <script>
    function validarFormulario() {
      const senha = document.getElementById("senha").value;
      const confirma = document.getElementById("confirma_senha").value;
      if (senha !== confirma) { alert("As senhas não coincidem."); return false; }
      return true;
    }
  </script>
</head>
<body th:classappend="${categoria == 'BANCOS_DE_DOACAO' ? 'cat-bancos' : (categoria == 'HOSPITAIS' ? 'cat-hospitais' : (categoria == 'ONGS' ? 'cat-ongs' : 'cat-outros'))}">

<nav class="navbar navbar-expand-lg navbar-premium">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand" th:href="@{/}">
      <div class="logo-text">
        <span class="logo-main">Fluxo Vital</span>
        <span class="logo-sub">Salvando Vidas</span>
      </div>
    </a>
    <a class="nav-link-inicio" th:href="@{/}"><i class="bi bi-house-door-fill"></i> Início</a>
  </div>
</nav>

<main class="form-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="form-card">

          <span class="cat-badge" th:switch="${categoria}">
            <i th:case="'BANCOS_DE_DOACAO'" class="fa-solid fa-droplet"></i>
            <i th:case="'HOSPITAIS'" class="fa-solid fa-hospital"></i>
            <i th:case="'ONGS'" class="fa-solid fa-people-group"></i>
            <i th:case="*" class="fa-solid fa-building-columns"></i>
            <span th:text="${categoriaLabel}">Categoria</span>
          </span>

          <h3>Cadastro da Instituição</h3>
          <p class="subtitle">Preencha os dados abaixo para registrar sua instituição na plataforma Fluxo Vital</p>

          <div class="alert-danger" th:if="${erro}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${erro}"></span>
          </div>

          <form method="POST" th:action="@{/instituicao/cadastro}" onsubmit="return validarFormulario()" novalidate>
            <input type="hidden" name="categoria" th:value="${categoria}"/>

            <div class="section-label"><i class="bi bi-building"></i> Identificação</div>
            <div class="row">
              <div class="col-md-8">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-building"></i></span>
                  <input class="form-control" id="nome" name="nome" placeholder="Nome da instituição" type="text" required/>
                </div>
              </div>
              <div class="col-md-4">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-file-earmark-text"></i></span>
                  <input class="form-control" id="cnpj" name="cnpj" placeholder="CNPJ (14 dígitos)" type="text" required pattern="\d{14}" title="Informe o CNPJ com 14 dígitos numéricos"/>
                </div>
              </div>
            </div>

            <div class="section-label"><i class="bi bi-shield-lock"></i> Acesso</div>
            <div class="row">
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                  <input class="form-control" id="email" name="email" placeholder="E-mail institucional" type="email" required/>
                </div>
              </div>
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                  <input class="form-control" id="telefone" name="telefone" placeholder="Telefone" type="tel"/>
                </div>
              </div>
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input class="form-control" id="senha" name="senha" placeholder="Senha (mínimo 6 caracteres)" type="password" required minlength="6"/>
                </div>
              </div>
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input class="form-control" id="confirma_senha" name="confirma_senha" placeholder="Confirme a senha" type="password" required/>
                </div>
              </div>
            </div>

            <div class="section-label"><i class="bi bi-geo-alt"></i> Localização</div>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
              <input class="form-control" id="endereco" name="endereco" placeholder="Endereço (rua, número, bairro)" type="text" required/>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-building"></i></span>
                  <input class="form-control" id="cidade" name="cidade" placeholder="Cidade" type="text" required/>
                </div>
              </div>
              <div class="col-md-3">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-signpost-2-fill"></i></span>
                  <input class="form-control" id="estado" name="estado" placeholder="UF" type="text" required maxlength="2" pattern="[A-Za-z]{2}"/>
                </div>
              </div>
              <div class="col-md-3">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-mailbox"></i></span>
                  <input class="form-control" id="cep" name="cep" placeholder="CEP" type="text" required/>
                </div>
              </div>
            </div>

            <button type="submit" class="btn-fluxo">
              <i class="bi bi-check-circle-fill me-2"></i>Cadastrar instituição
            </button>
          </form>

          <a th:href="@{'/instituicao/login?categoria=' + ${categoria}}" class="login-link">
            <small>Já tem cadastro? <strong>Faça login</strong></small>
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Fluxo Vital - Todos os direitos reservados
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
